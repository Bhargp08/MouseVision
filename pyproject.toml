[project]
name = "mousevision"
version = "0.0.1"
description = "Encode/decode mouse visual cortex (Allen Brain Observatory) and compare with CNN layers."
requires-python = "==3.11.*"
dependencies = [
  "allensdk==2.16.2",      # last release (2023-11-30); hard-pins numpy<1.24, pandas==1.5.3, scipy<1.11
  "numpy==1.23.5",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "setuptools<81",         # allensdk imports pkg_resources (removed in setuptools>=81)
  "scikit-learn",
  "streamlit",
  "plotly",
]

[project.optional-dependencies]
cnn = ["torch==2.2.2", "torchvision==0.17.2"]  # last releases with macOS x86_64 wheels

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mousevision"]

[tool.uv]
# Freeze the whole resolver at a date when allensdk's old pins still had compatible
# neighbours (newer statsmodels/hdmf/pynwb break allensdk imports).
exclude-newer = "2024-06-01T00:00:00Z"
environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or cached Allen data; not run in CI"]
